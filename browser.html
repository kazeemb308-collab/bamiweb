<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bamiweb - Your Personal Search Hub</title>
        <link rel="icon" type="image/png" href="favicon.png">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f1f3f4;
            color: #202124;
        }

        .browser-header {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding: 14px 18px;
            gap: 10px;
            background: #fff;
            border-bottom: 1px solid #dfe1e5;
            box-shadow: 0 1px 2px rgba(60, 64, 67, 0.08);
            position: sticky;
            top: 0;
            z-index: 200;
        }

        .browser-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .browser-logo {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 18px;
            font-weight: 700;
            color: #202124;
        }

        .browser-logo span:nth-child(1) { color: rgba(78, 156, 78, 0.726); }
        .browser-logo span:nth-child(2) { color: rgb(180, 96, 96); }
        .browser-logo span:nth-child(3) { color: rgb(190, 190, 107); }
        .browser-logo span:nth-child(4) { color: rgb(100, 100, 201); }
        .browser-logo span:nth-child(5) { color: rgb(129, 199, 129); }
        .browser-logo span:nth-child(6) { color: rgb(187, 125, 125); }
        .browser-logo span:nth-child(7) { color: rgb(132, 132, 211); }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-controls button,
        .tab-button {
            background: #fff;
            border: 1px solid #dadce0;
            color: #3c4043;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s;
            font-size: 15px;
        }

        .header-controls button:hover,
        .tab-button:hover {
            background-color: #f8f9fa;
        }

        .browser-tabs {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px;
            border: 1px solid #dadce0;
            border-radius: 12px;
            background: #fff;
            flex-wrap: wrap;
            width: fit-content;
            margin-top: 2px;
        }

        .tab {
            background: #fff;
            border: 1px solid #dadce0;
            border-radius: 10px 10px 0 0;
            padding: 10px 16px;
            cursor: pointer;
            min-width: 46px;
            color: #3c4043;
        }

        .tab.active {
            background: #fff;
            border-bottom-color: #fff;
            color: #1a73e8;
        }

        .new-tab {
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 50%;
            border: none;
            background: #1a73e8;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        .new-tab:hover {
            background: #1558c0;
        }

        .header-search {
            width: 100%;
            background-color: #f1f3f4;
            padding: 22px 18px;
            display: flex;
            justify-content: center;
        }

        .search-form {
            width: 100%;
            max-width: 980px;
        }

        .search-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-wrapper {
            flex: 1;
        }

        .search-input {
            width: 100%;
            min-height: 56px;
            border-radius: 999px;
            border: 1px solid #dadce0;
            padding: 0 22px;
            font-size: 16px;
            outline: none;
            background: #fff;
            color: #202124;
            box-shadow: inset 0 1px 2px rgba(60, 64, 67, 0.08);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input::placeholder {
            color: #5f6368;
        }

        .search-input:focus {
            border-color: #1a73e8;
            box-shadow: 0 1px 3px rgba(26, 115, 232, 0.18);
        }

        .search-btn {
            min-width: 130px;
            height: 56px;
            border-radius: 999px;
            background: #1a73e8;
            border: none;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .search-btn:hover {
            background: #1558c0;
        }

        .browser-view {
            padding: 18px;
            background: #f1f3f4;
            min-height: calc(100vh - 250px);
            overflow: hidden;
        }

        .results-card {
            width: 100%;
            max-width: 1320px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #e8eaed;
            border-radius: 18px;
            min-height: 420px;
            box-shadow: 0 8px 24px rgba(60, 64, 67, 0.08);
        }

        .page-viewer {
            width: 100%;
            height: 100%;
            min-height: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
        }

        .page-frame {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 16px;
        }

        .welcome {
            text-align: center;
            color: #5f6368;
            padding: 36px 34px;
        }

        .welcome i {
            font-size: 52px;
            color: #1a73e8;
            margin-bottom: 18px;
        }

        .welcome h2 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        .welcome p {
            font-size: 16px;
            margin: 0;
        }
    </style>
    </head>
    <body>
        <!-- Browser Header -->
    <div class="browser-header">
        <div class="browser-topbar">
            <div class="browser-logo">
                <span>B</span><span>A</span><span>M</span><span>I</span><span>w</span><span>e</span><span>b</span>
            </div>
            <div class="header-controls">
                <button id="back-btn">&larr;</button>
                <button id="forward-btn">&rarr;</button>
                <button id="refresh-btn">&#x21bb;</button>
                <button id="home-btn">&#8962;</button>
            </div>
        </div>
        <div class="header-search">
            <form id="searchForm" class="search-form">
                <div class="search-row">
                    <div class="search-wrapper">
                        <input id="searchInput" class="search-input" type="text" name="q" placeholder="Search or type a URL" autocomplete="off">
                    </div>
                    <button type="submit" id="search-btn" class="search-btn">Search</button>
                </div>
            </form>
        </div>
        <div class="browser-tabs">
            <button class="tab active" data-tab-id="tab-1"><span>1</span></button>
            <button id="new-tab" class="new-tab">+</button>
            <button id="close-tab-btn" class="tab-button">&times;</button>
        </div>
    </div>
    <div class="browser-view">
        <div class="results-card">
            <div id="page-viewer" class="page-viewer">
                <div class="welcome">
                    <i class="fa-solid fa-globe"></i>
                    <h2>Welcome to BAMI Browser</h2>
                    <p>Use the search bar above to search the web and see results here.</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        const searchForm = document.getElementById("searchForm");
        const searchInput = document.getElementById("searchInput");
        const backBtn = document.getElementById("back-btn");
        const forwardBtn = document.getElementById("forward-btn");
        const refreshBtn = document.getElementById("refresh-btn");
        const homeBtn = document.getElementById("home-btn");
        const tabsContainer = document.querySelector(".browser-tabs");
        const newTabBtn = document.getElementById("new-tab");
        const closeTabBtn = document.getElementById("close-tab-btn");
        const pageViewer = document.getElementById("page-viewer");

        // Tab state with individual history for each tab
        const tabsState = [
            { 
                id: 'tab-1', 
                label: '1', 
                currentUrl: '', 
                history: [],
                historyIndex: -1
            }
        ];
        const tabFrames = {};
        let activeTabId = 'tab-1';
        let tabCount = 1;

        function isLink(query) {
            const trimmed = query.trim();
            return /^(https?:\/\/|www\.|[a-zA-Z0-9.-]+\.[a-z]{2,})(\/|$)/i.test(trimmed);
        }

        function buildUrl(query) {
            const trimmed = query.trim();
            if (!trimmed) return '';
            if (/^(https?:\/\/)/i.test(trimmed)) return trimmed;
            if (/^www\./i.test(trimmed)) return 'https://' + trimmed;
            if (/^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(\/.*)?$/i.test(trimmed)) return 'https://' + trimmed;
            return '';
        }

        function getTabs() {
            return Array.from(document.querySelectorAll('.tab'));
        }

        function getTabButtonById(id) {
            return document.querySelector(`.tab[data-tab-id="${id}"]`);
        }

        function getActiveTabState() {
            return tabsState.find(tab => tab.id === activeTabId) || tabsState[0];
        }

        function activateTab(tab) {
            if (!tab) return;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            activeTabId = tab.dataset.tabId;
            const activeState = getActiveTabState();
            if (activeState) {
                searchInput.value = '';
                renderActiveTabContent();
            }
        }

        function createTabButton(state) {
            const tab = document.createElement('button');
            tab.className = 'tab';
            tab.dataset.tabId = state.id;
            tab.innerHTML = `<span>${state.label}</span>`;
            tab.addEventListener('click', () => activateTab(tab));
            return tab;
        }

        function createTabState() {
            tabCount += 1;
            const id = `tab-${Date.now()}-${Math.floor(Math.random() * 10000)}`;
            const state = { 
                id, 
                label: `${tabCount}`, 
                currentUrl: '', 
                history: [],
                historyIndex: -1
            };
            tabsState.push(state);
            return state;
        }

        function addToHistory(tabState, url) {
            // Remove any forward history if we're not at the end
            if (tabState.historyIndex < tabState.history.length - 1) {
                tabState.history = tabState.history.slice(0, tabState.historyIndex + 1);
            }
            // Add new URL to history
            tabState.history.push(url);
            tabState.historyIndex = tabState.history.length - 1;
        }

        function navigateToUrl(url) {
            const activeState = getActiveTabState();
            activeState.currentUrl = url;
            addToHistory(activeState, url);
            renderActiveTabContent();
        }

        function canGoBack() {
            const activeState = getActiveTabState();
            return activeState.historyIndex > 0;
        }

        function canGoForward() {
            const activeState = getActiveTabState();
            return activeState.historyIndex < activeState.history.length - 1;
        }

        function goBack() {
            const activeState = getActiveTabState();
            if (canGoBack()) {
                activeState.historyIndex--;
                activeState.currentUrl = activeState.history[activeState.historyIndex];
                renderActiveTabContent();
            }
        }

        function goForward() {
            const activeState = getActiveTabState();
            if (canGoForward()) {
                activeState.historyIndex++;
                activeState.currentUrl = activeState.history[activeState.historyIndex];
                renderActiveTabContent();
            }
        }

        function renderWelcome() {
            pageViewer.innerHTML = `
                <div class="welcome">
                    <i class="fa-solid fa-globe"></i>
                    <h2>Welcome to BAMI Browser</h2>
                    <p>Use the search bar above to search the web and see results here.</p>
                </div>`;
        }

        function renderActiveTabContent() {
            const active = getActiveTabState();
            pageViewer.innerHTML = '';

            if (!active.currentUrl) {
                renderWelcome();
                return;
            }

            // Create or update iframe for this tab
            if (!tabFrames[active.id]) {
                const iframe = document.createElement('iframe');
                iframe.id = `iframe-${active.id}`;
                iframe.className = 'page-frame';
                iframe.src = active.currentUrl;
                tabFrames[active.id] = iframe;
            } else {
                tabFrames[active.id].src = active.currentUrl;
            }
            pageViewer.appendChild(tabFrames[active.id]);
        }

        if (searchForm && searchInput) {
            searchForm.addEventListener("submit", function (e) {
                e.preventDefault();
                const query = searchInput.value.trim();
                if (!query) return;

                let url;
                if (isLink(query)) {
                    url = buildUrl(query);
                } else {
                    url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                }

                navigateToUrl(url);
                searchInput.value = '';
            });
        }

        if (newTabBtn && tabsContainer) {
            newTabBtn.addEventListener('click', function (e) {
                e.preventDefault();
                const state = createTabState();
                const tab = createTabButton(state);
                tabsContainer.insertBefore(tab, newTabBtn);
                activateTab(tab);
            });
        }

        if (closeTabBtn) {
            closeTabBtn.addEventListener('click', function () {
                const tabs = getTabs();
                if (tabs.length <= 1) {
                    alert('You must keep at least one tab.');
                    return;
                }
                const activeState = getActiveTabState();
                const activeTabButton = getTabButtonById(activeState.id);
                if (activeTabButton) activeTabButton.remove();
                const removedIndex = tabsState.findIndex(tab => tab.id === activeState.id);
                tabsState.splice(removedIndex, 1);
                delete tabFrames[activeState.id];
                const newIndex = Math.min(removedIndex, tabsState.length - 1);
                const nextTabBtn = getTabButtonById(tabsState[newIndex].id);
                if (nextTabBtn) activateTab(nextTabBtn);
            });
        }

        if (backBtn) backBtn.addEventListener('click', goBack);
        if (forwardBtn) forwardBtn.addEventListener('click', goForward);
        if (refreshBtn) refreshBtn.addEventListener('click', () => {
            const activeState = getActiveTabState();
            if (activeState.currentUrl) {
                renderActiveTabContent();
            }
        });
        if (homeBtn) homeBtn.addEventListener('click', () => {
            const activeState = getActiveTabState();
            activeState.currentUrl = '';
            activeState.history = [];
            activeState.historyIndex = -1;
            searchInput.value = '';
            renderActiveTabContent();
        });

        renderActiveTabContent();
    </script>
    </body>
</html>
