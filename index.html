<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bamiweb">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <title>Bamiweb - Your Personal Search Hub</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f1f3f4;
            color: #202124;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Browser Header */
        .browser-header {
            background-color: #ffffff;
            border-bottom: 1px solid #dfe1e5;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .browser-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .browser-logo {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 2px;
            color: #202124;
        }

        .browser-logo span:nth-child(1) { color: rgba(78, 156, 78, 0.726); }
        .browser-logo span:nth-child(2) { color: rgb(180, 96, 96); }
        .browser-logo span:nth-child(3) { color: rgb(190, 190, 107); }
        .browser-logo span:nth-child(4) { color: rgb(100, 100, 201); }
        .browser-logo span:nth-child(5) { color: rgb(129, 199, 129); }
        .browser-logo span:nth-child(6) { color: rgb(187, 125, 125); }
        .browser-logo span:nth-child(7) { color: rgb(132, 132, 211); }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .header-controls button {
            background: #fff;
            border: 1px solid #dadce0;
            color: #3c4043;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .header-controls button:hover {
            background-color: #f8f9fa;
        }

        .search-container {
            display: flex;
            justify-content: center;
        }

        .search-form {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid #dadce0;
            font-size: 14px;
            outline: none;
            background: #fff;
        }

        .search-input:focus {
            border-color: #1a73e8;
            box-shadow: 0 1px 3px rgba(26, 115, 232, 0.18);
        }

        .search-btn {
            padding: 10px 20px;
            border-radius: 20px;
            background: #1a73e8;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .search-btn:hover {
            background: #1558c0;
        }

        .browser-tabs {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 5px;
            border: 1px solid #dadce0;
            border-radius: 10px;
            background: #fff;
            width: fit-content;
        }

        .tab {
            background: #fff;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            min-width: 40px;
            color: #3c4043;
            font-size: 14px;
        }

        .tab.active {
            background: #f8f9fa;
            color: #1a73e8;
            border-color: #1a73e8;
        }

        .new-tab {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 50%;
            border: none;
            background: #1a73e8;
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.2s;
        }

        .new-tab:hover {
            background: #1558c0;
        }

        .tab-button {
            background: #fff;
            border: 1px solid #dadce0;
            color: #3c4043;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .tab-button:hover {
            background-color: #f8f9fa;
        }

        .browser-view {
            flex: 1;
            overflow: hidden;
            display: flex;
            justify-content: center;
            padding: 16px;
            background: #f1f3f4;
        }

        .results-card {
            width: 100%;
            max-width: 1200px;
            background: #fff;
            border: 1px solid #e8eaed;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .page-viewer {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            position: relative;
        }

        .page-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .welcome {
            text-align: center;
            color: #5f6368;
            padding: 40px 20px;
        }

        .welcome i {
            font-size: 48px;
            color: #1a73e8;
            margin-bottom: 16px;
            display: block;
        }

        .welcome h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #202124;
        }

        .welcome p {
            font-size: 16px;
            color: #5f6368;
        }
    </style>
</head>
<body>
    <div class="browser-header">
        <div class="browser-topbar">
            <div class="browser-logo">
                <span>B</span><span>A</span><span>M</span><span>I</span><span>w</span><span>e</span><span>b</span>
            </div>
            <div class="header-controls">
                <button id="back-btn" title="Back">&larr;</button>
                <button id="forward-btn" title="Forward">&rarr;</button>
                <button id="refresh-btn" title="Refresh">&#x21bb;</button>
                <button id="home-btn" title="Home">&#8962;</button>
            </div>
        </div>
        <div class="search-container">
            <form id="searchForm" class="search-form">
                <input id="searchInput" class="search-input" type="text" placeholder="Search or type a URL" autocomplete="off">
                <button type="submit" class="search-btn">Search</button>
            </form>
        </div>
        <div class="browser-tabs">
            <button class="tab active" data-tab-id="tab-1"><span>1</span></button>
            <button id="new-tab" class="new-tab" title="New Tab">+</button>
            <button id="close-tab-btn" class="tab-button" title="Close Tab">&times;</button>
        </div>
    </div>
    <div class="browser-view">
        <div class="results-card">
            <div id="page-viewer" class="page-viewer">
                <div class="welcome">
                    <i class="fa-solid fa-globe"></i>
                    <h2>Welcome to BAMI Browser</h2>
                    <p>Use the search bar above to search the web</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const searchForm = document.getElementById("searchForm");
        const searchInput = document.getElementById("searchInput");
        const backBtn = document.getElementById("back-btn");
        const forwardBtn = document.getElementById("forward-btn");
        const refreshBtn = document.getElementById("refresh-btn");
        const homeBtn = document.getElementById("home-btn");
        const tabsContainer = document.querySelector(".browser-tabs");
        const newTabBtn = document.getElementById("new-tab");
        const closeTabBtn = document.getElementById("close-tab-btn");
        const pageViewer = document.getElementById("page-viewer");

        const tabsState = [
            { 
                id: 'tab-1', 
                label: '1', 
                currentUrl: '', 
                history: [],
                historyIndex: -1
            }
        ];
        const tabFrames = {};
        let activeTabId = 'tab-1';
        let tabCount = 1;

        function isLink(query) {
            const trimmed = query.trim();
            return /^(https?:\/\/|www\.|[a-zA-Z0-9.-]+\.[a-z]{2,})(\/|$)/i.test(trimmed);
        }

        function buildUrl(query) {
            const trimmed = query.trim();
            if (!trimmed) return '';
            if (/^(https?:\/\/)/i.test(trimmed)) return trimmed;
            if (/^www\./i.test(trimmed)) return 'https://' + trimmed;
            if (/^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(\/.*)?$/i.test(trimmed)) return 'https://' + trimmed;
            return '';
        }

        function getTabs() {
            return Array.from(document.querySelectorAll('.tab'));
        }

        function getTabButtonById(id) {
            return document.querySelector(`.tab[data-tab-id="${id}"]`);
        }

        function getActiveTabState() {
            return tabsState.find(tab => tab.id === activeTabId) || tabsState[0];
        }

        function activateTab(tab) {
            if (!tab) return;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            activeTabId = tab.dataset.tabId;
            const activeState = getActiveTabState();
            if (activeState) {
                searchInput.value = '';
                renderActiveTabContent();
            }
        }

        function createTabButton(state) {
            const tab = document.createElement('button');
            tab.className = 'tab';
            tab.dataset.tabId = state.id;
            tab.innerHTML = `<span>${state.label}</span>`;
            tab.addEventListener('click', () => activateTab(tab));
            return tab;
        }

        function createTabState() {
            tabCount += 1;
            const id = `tab-${Date.now()}-${Math.floor(Math.random() * 10000)}`;
            const state = { 
                id, 
                label: `${tabCount}`, 
                currentUrl: '', 
                history: [],
                historyIndex: -1
            };
            tabsState.push(state);
            return state;
        }

        function addToHistory(tabState, url) {
            if (tabState.historyIndex < tabState.history.length - 1) {
                tabState.history = tabState.history.slice(0, tabState.historyIndex + 1);
            }
            tabState.history.push(url);
            tabState.historyIndex = tabState.history.length - 1;
        }

        function navigateToUrl(url) {
            const activeState = getActiveTabState();
            activeState.currentUrl = url;
            addToHistory(activeState, url);
            renderActiveTabContent();
        }

        function canGoBack() {
            const activeState = getActiveTabState();
            return activeState.historyIndex > 0;
        }

        function canGoForward() {
            const activeState = getActiveTabState();
            return activeState.historyIndex < activeState.history.length - 1;
        }

        function goBack() {
            const activeState = getActiveTabState();
            if (canGoBack()) {
                activeState.historyIndex--;
                activeState.currentUrl = activeState.history[activeState.historyIndex];
                renderActiveTabContent();
            }
        }

        function goForward() {
            const activeState = getActiveTabState();
            if (canGoForward()) {
                activeState.historyIndex++;
                activeState.currentUrl = activeState.history[activeState.historyIndex];
                renderActiveTabContent();
            }
        }

        function renderWelcome() {
            pageViewer.innerHTML = `
                <div class="welcome">
                    <i class="fa-solid fa-globe"></i>
                    <h2>Welcome to BAMI Browser</h2>
                    <p>Use the search bar above to search the web</p>
                </div>`;
        }

        function renderActiveTabContent() {
            const active = getActiveTabState();
            pageViewer.innerHTML = '';

            if (!active.currentUrl) {
                renderWelcome();
                return;
            }

            if (!tabFrames[active.id]) {
                const iframe = document.createElement('iframe');
                iframe.id = `iframe-${active.id}`;
                iframe.className = 'page-frame';
                iframe.src = active.currentUrl;
                tabFrames[active.id] = iframe;
            } else {
                tabFrames[active.id].src = active.currentUrl;
            }
            pageViewer.appendChild(tabFrames[active.id]);
        }

        if (searchForm && searchInput) {
            searchForm.addEventListener("submit", function (e) {
                e.preventDefault();
                const query = searchInput.value.trim();
                if (!query) return;

                let url;
                if (isLink(query)) {
                    url = buildUrl(query);
                } else {
                    url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                }

                navigateToUrl(url);
                searchInput.value = '';
            });
        }

        if (newTabBtn && tabsContainer) {
            newTabBtn.addEventListener('click', function (e) {
                e.preventDefault();
                const state = createTabState();
                const tab = createTabButton(state);
                tabsContainer.insertBefore(tab, newTabBtn);
                activateTab(tab);
            });
        }

        if (closeTabBtn) {
            closeTabBtn.addEventListener('click', function () {
                const tabs = getTabs();
                if (tabs.length <= 1) {
                    alert('You must keep at least one tab.');
                    return;
                }
                const activeState = getActiveTabState();
                const activeTabButton = getTabButtonById(activeState.id);
                if (activeTabButton) activeTabButton.remove();
                const removedIndex = tabsState.findIndex(tab => tab.id === activeState.id);
                tabsState.splice(removedIndex, 1);
                delete tabFrames[activeState.id];
                const newIndex = Math.min(removedIndex, tabsState.length - 1);
                const nextTabBtn = getTabButtonById(tabsState[newIndex].id);
                if (nextTabBtn) activateTab(nextTabBtn);
            });
        }

        if (backBtn) backBtn.addEventListener('click', goBack);
        if (forwardBtn) forwardBtn.addEventListener('click', goForward);
        if (refreshBtn) refreshBtn.addEventListener('click', () => {
            const activeState = getActiveTabState();
            if (activeState.currentUrl) {
                renderActiveTabContent();
            }
        });
        if (homeBtn) homeBtn.addEventListener('click', () => {
            const activeState = getActiveTabState();
            activeState.currentUrl = '';
            activeState.history = [];
            activeState.historyIndex = -1;
            searchInput.value = '';
            renderActiveTabContent();
        });

        renderActiveTabContent();
    </script>
</body>
</html>
