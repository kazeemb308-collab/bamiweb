<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images - BAMIweb</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Basic Styling For The Navigation Bar */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
        }
        .navbar {
            background-color: #f5f5f5;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
            margin:0%;
            position: sticky;
            top: 0;
        }
        .navbar a {
            color: rgb(5, 5, 5);
            text-decoration: none;
            padding: 14px 12px;
            font-size: 16px;
        }
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }
        h1 {
            text-align: center;
            margin-top: 50px;
            font-size: 50px;
            font-family: 'Roboto', sans-serif;
            padding: 30px;
        } 
        .history-box {
            width: min(92%, 600px);
            background: #fff;
            border: 1px solid #dfe1e5;
            border-radius: 12px;
            padding: 30px 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            position: absolute;
            left: 330px;
            top: 350px;
        }
        .history-title {
            font-size: 13px;
            font-weight: 700;
            color: #5553
            margin: 0 0 0px;
        }
        .history-header {
            display: flex;
            position: absolute;
            top: 5px;
        }
        .clear-history-btn {
            background: transparent;
            border: none;
            color: #4097ee;
            font-size: 12px;
            cursor: pointer;
            padding: 0;
        }
        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .history-item {
            background: #f7f7f7;
            border: 1px solid #e2e2e2;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
        }
        .history-item:hover {
            background: #eef4ff;
        }
        div { font-family: 'Roboto', sans-serif; font-size: 10px; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="images.html">Images</a>
        <a href="news.html">News</a>
        <a href="videos.html">Videos</a>
        <a href="map.html">Maps</a>
    </div>
    <h1 style="text-align: center;">
        <span style="color: rgba(78, 156, 78, 0.726);">B</span><span style="color: rgb(180, 96, 96);">A</span><span style="color: rgb(190, 190, 107);">M</span><span style="color: rgb(100, 100, 201);">I</span><span style="color: rgb(129, 199, 129);">w</span><span style="color: rgb(187, 125, 125);">e</span><span style="color: rgb(132, 132, 211);">b</span>
    </h1>
    <div style="text-align: center; position: absolute; top: 192px; right: 537px; color: blue">Images</div>
    <form action="https://www.google.com/search" method="get" style="text-align: center; margin-top: 20px;">
        <input type="text" name="q" placeholder="Search Images" style="width: 90%; height: 30px; font-size: 16px; max-width: 500px; padding: 0px; border-radius: 20px; border: 1px solid white;">
        <input type="hidden" name="tbm" value="isch" style="height: 36px; font-size: 16px; padding: 10px 25px;border-radius: 20px; background-color: #4097ee; border: none; cursor: pointer;">
        <button type="submit" style="height: 30px; font-size: 16px; padding: 5px 20px; border-radius: 20px; background-color: #4097ee; border: none; cursor: pointer;">Search</button>
        </form>
        <div id="search-history" class="history-box">
            <div class="history-header">
                <p class="history-title" style="position: absolute; top: -22px;">Recent searches</p>
                <button style="color: black; background: #4097ee; border: 1px solid wheat; position:absolute; right: -500px; top: -22px; border-radius: 5px; padding: 5px 10px;" type="button" class="clear-history-btn" id="clear-history-btn"><b>Clear</b></button>
            </div>
            <div id="history-list" class="history-list"></div>
        </div>
</body>
</html>
