<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI - BAMIweb</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #0f1115;
            color: #f5f7fb;
            font-family: 'Roboto', sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .browser-header {
            background-color: #1a1a1a;
            border-bottom: 1px solid #333333;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .browser-logo {
            font-size: 24px;
            font-weight: 700;
            display: absolute;
            align-items: center;
            gap: 0px;
            color: #202124;
        }
        .browser-logo span:nth-child(1) { color: rgba(78, 156, 78, 0.726); }
        .browser-logo span:nth-child(2) { color: rgb(180, 96, 96); }
        .browser-logo span:nth-child(3) { color: rgb(190, 190, 107); }
        .browser-logo span:nth-child(4) { color: rgb(100, 100, 201); }
        .browser-logo span:nth-child(5) { color: rgb(129, 199, 129); }
        .browser-logo span:nth-child(6) { color: rgb(187, 125, 125); }
        .browser-logo span:nth-child(7) { color: rgb(132, 132, 211); }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }
        .header-controls button {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .header-controls button:hover {
            background-color: #333333;
        }
        .history-toggle {
            font-size: 20px;
            line-height: 1;
            padding: 6px 10px;
        }
        .settings-panel {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 290px;
            max-width: calc(100vw - 24px);
            background: #14171d;
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
            display: none;
            z-index: 1100;
        }
        .settings-panel.open {
            display: block;
        }
        .settings-panel h4 {
            margin: 0 0 10px;
            font-size: 15px;
        }
        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }
        .settings-group label {
            font-size: 12px;
            color: #b8c0ce;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .settings-group select,
        .settings-group input[type="range"],
        .settings-group input[type="text"] {
            width: 100%;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 10px;
            background: #0f1115;
            color: #fff;
            padding: 8px 10px;
            box-sizing: border-box;
        }
        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 13px;
            color: #f2f4f8;
        }
        .settings-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }
        .settings-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .settings-actions button {
            flex: 1;
            padding: 8px 10px;
            border-radius: 999px;
            background: #2f6fed;
            color: #fff;
            font-size: 12px;
        }
        .settings-actions button.secondary {
            background: rgba(255,255,255,0.08);
        }
        .upload-btn.disabled {
            opacity: 0.45;
            pointer-events: none;
        }
        .logo-large {
            font-size: 72px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            gap: 0;
            margin: 24px 0 16px;
        }
        .logo-small {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            gap: 0;
            margin-bottom: 12px;
            color: rgb(67, 183, 221);
        }
        .ai-container {
            flex: 1;
            display: flex;
            gap: 18px;
            padding: 0 14px 140px;
            min-height: 0;
            position: relative;
        }
        .history-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 10;
        }
        .history-backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }
        .history-panel {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            max-width: calc(100vw - 24px);
            background: rgba(10, 12, 16, 0.98);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 0 18px 18px 0;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transform: translateX(-102%);
            transition: transform 0.25s ease;
            z-index: 20;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
        }
        .history-panel.open {
            transform: translateX(0);
        }
        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .history-header h3 {
            margin: 0;
            font-size: 15px;
            color: #dfe5f2;
        }
        .history-header button,
        .history-item button {
            border: none;
            background: transparent;
            color: #fff;
            cursor: pointer;
        }
        #new-chat-btn {
            background: #2f6fed;
            padding: 7px 10px;
            border-radius: 999px;
            font-size: 12px;
        }
        #history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            padding-right: 2px;
        }
        .history-empty {
            padding: 14px;
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            color: #b8c0ce;
            font-size: 13px;
            text-align: center;
        }
        .history-item {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 10px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 6px;
            color: #f3f5f8;
        }
        .history-item.active {
            background: rgba(47,111,237,0.2);
            border-color: rgba(47,111,237,0.45);
        }
        .history-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .history-title {
            font-size: 13px;
            font-weight: 600;
        }
        .history-meta {
            font-size: 11px;
            color: #9aa5b3;
        }
        .pin-btn {
            font-size: 13px;
            opacity: 0.75;
        }
        .pin-btn.pinned {
            color: #ffd166;
            opacity: 1;
        }
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }
        #chat-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 16px 6px 150px;
            overflow-y: auto;
            flex: 1;
        }
        .empty-state {
            margin: auto;
            max-width: 420px;
            text-align: center;
            color: #9aa5b3;
            padding: 20px;
            border: 1px dashed rgba(255,255,255,0.18);
            border-radius: 16px;
            background: rgba(255,255,255,0.03);
        }
        .user {
            align-self: flex-end;
            max-width: min(82%, 720px);
            background: linear-gradient(135deg, #3d3535, #544a4a);
            color: white;
            padding: 14px 16px;
            border-radius: 18px 18px 6px 18px;
            font-size: 15px;
            line-height: 1.65;
            word-wrap: break-word;
        }
        .bot {
            align-self: flex-start;
            width: fit-content;
            max-width: min(92%, 860px);
            background: #14171d;
            color: white;
            padding: 14px 16px;
            font-size: 15px;
            line-height: 1.65;
            word-wrap: break-word;
            text-align: left;
            border-radius: 18px 18px 18px 6px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .bot > :first-child { margin-top: 0; }
        .bot > :last-child { margin-bottom: 0; }
        .bot pre {
            white-space: pre-wrap;
            overflow-x: auto;
            background: rgba(255,255,255,0.08);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 13px;
            line-height: 1.6;
        }
        .bot code {
            background: rgba(255,255,255,0.12);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 13px;
        }
        .bot ul,
        .bot ol {
            padding-left: 20px;
            margin: 10px 0;
            line-height: 1.8;
        }
        .bot li {
            margin: 6px 0;
        }
        .bot p {
            margin: 0 0 10px;
        }
        .bot p:last-child {
            margin-bottom: 0;
        }
        .bot blockquote {
            margin: 10px 0;
            padding: 10px 12px;
            border-left: 3px solid #2f6fed;
            background: rgba(47,111,237,0.1);
            color: #c7d2e5;
            border-radius: 6px;
        }
        .bot table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 13px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            overflow-x: auto;
            display: block;
        }
        .bot th,
        .bot td {
            border: 1px solid rgba(255,255,255,0.12);
            padding: 10px 12px;
            text-align: left;
        }
        .bot th {
            background: rgba(47,111,237,0.2);
            color: #e8f0ff;
            font-weight: 600;
        }
        .bot tr:nth-child(even) td {
            background: rgba(255,255,255,0.03);
        }
        .media-attachment {
            margin-top: 8px;
            max-width: 260px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.16);
        }
        .media-attachment img {
            display: block;
            width: 100%;
        }
        .media-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0 0;
            padding: 8px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            width: fit-content;
            max-width: 100%;
        }
        .media-preview img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 8px;
        }
        .ai-input {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: min(96vw, 860px);
            max-width: 860px;
            align-self: center;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: rgba(16, 19, 23, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            z-index: 1001;
        }
        .ai-input input {
            flex: 1;
            height: 48px;
            padding: 0 10px;
            border: none;
            outline: none;
            border-radius: 999px;
            background: transparent;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }
        .ai-input input::placeholder {
            color: #b3b3b3;
        }
        .upload-btn,
        .submit-btn {
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .upload-btn {
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 18px;
        }
        .submit-btn {
            background: #2f6fed;
            color: white;
            font-size: 18px;
        }
        .upload-btn:hover { background: rgba(255,255,255,0.16); }
        .submit-btn:hover { background: #1f5ce0; }
        #media-input { display: none; }
        @media (max-width: 860px) {
            .ai-container {
                flex-direction: column;
                padding: 0 10px 110px;
            }
            .history-panel {
                width: 100%;
                max-height: 240px;
            }
        }
        @media (max-width: 600px) {
            .ai-input {
                bottom: 12px;
                width: calc(100vw - 16px);
            }
            .ai-input input {
                height: 44px;
                font-size: 14px;
            }
            .upload-btn,
            .submit-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
            .bot {
                max-width: 95%;
                padding: 12px 14px;
            }
            .user {
                max-width: 95%;
                padding: 12px 14px;
            }
            .bot p {
                margin: 0 0 12px;
                line-height: 1.7;
                word-spacing: 0.05em;
            }
            .bot ul,
            .bot ol {
                padding-left: 18px;
                margin: 12px 0;
                line-height: 1.8;
            }
            .bot table {
                font-size: 12px;
                margin: 12px -2px;
            }
            .bot th,
            .bot td {
                padding: 8px 10px;
            }
            .bot pre {
                padding: 10px;
                font-size: 12px;
                line-height: 1.7;
                margin: 8px 0;
            }
            .bot code {
                font-size: 12px;
            }
            #chat-box {
                gap: 14px;
                padding: 12px 4px 130px;
            }
        }
        @media (max-width: 480px) {
            .browser-header {
                padding: 10px 12px;
            }
            .logo-large {
                font-size: 48px;
                margin: 16px 0 12px;
            }
            .bot, .user {
                max-width: 98%;
                font-size: 14px;
                padding: 10px 12px;
            }
            .bot p {
                margin: 0 0 14px;
                line-height: 1.75;
            }
            .bot table {
                font-size: 11px;
                margin: 10px 0;
            }
            .bot th,
            .bot td {
                padding: 6px 8px;
            }
            #chat-box {
                gap: 12px;
                padding: 10px 2px 120px;
            }
            .media-attachment {
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="browser-header">
        <div class="browser-logo">
            <span>B</span><span>A</span><span>M</span><span>I</span><span>w</span><span>e</span><span>b</span>
        </div>
        <div class="header-controls">
            <button title="Open chats" id="history-toggle" class="history-toggle" type="button" aria-expanded="false" aria-controls="history-panel">☰</button>
            <button title="Refresh" id="refresh-btn" type="button">⟳</button>
            <button title="Settings" id="settings-btn" type="button">⚙</button>
            <div id="settings-panel" class="settings-panel" hidden>
                <h4>Assistant settings</h4>
                <div class="settings-group">
                    <label>
                        Model
                        <select id="model-select">
                            <option value="openrouter/free">OpenRouter Free</option>
                            <option value="openrouter/auto">OpenRouter Auto</option>
                            <option value="openai/gpt-4o-mini">GPT-4o mini</option>
                        </select>
                    </label>
                </div>
                <div class="settings-group">
                    <label>
                        Creativity
                        <input id="temperature-range" type="range" min="0" max="1" step="0.1">
                        <span id="temperature-value">0.7</span>
                    </label>
                </div>
                <div class="settings-group">
                    <label>
                        Reply style
                        <select id="reply-style">
                            <option value="balanced">Balanced</option>
                            <option value="concise">Concise</option>
                            <option value="detailed">Detailed</option>
                        </select>
                    </label>
                </div>
                <div class="settings-group">
                    <label class="settings-row">
                        <span>Image upload</span>
                        <input id="image-toggle" type="checkbox">
                    </label>
                    <label class="settings-row">
                        <span>Markdown</span>
                        <input id="markdown-toggle" type="checkbox">
                    </label>
                </div>
                <div class="settings-actions">
                    <button id="clear-history-btn" type="button">Clear history</button>
                    <button id="reset-settings-btn" class="secondary" type="button">Reset</button>
                </div>
            </div>
        </div>
    </div>
    <div class="logo-large">
        <span style="color: rgba(78, 156, 78, 0.726);">B</span><span style="color: rgb(180, 96, 96);">A</span><span style="color: rgb(190, 190, 107);">M</span><span style="color: rgb(100, 100, 201);">I</span><span style="color: rgb(129, 199, 129);">w</span><span style="color: rgb(187, 125, 125);">e</span><span style="color: rgb(132, 132, 211);">b</span>
        <div class="logo-small">AI</div>
    </div>
    <div class="ai-container">
        <div id="history-backdrop" class="history-backdrop"></div>
        <aside id="history-panel" class="history-panel">
            <div class="history-header">
                <h3>Chats</h3>
                <button id="new-chat-btn" type="button">New chat</button>
            </div>
            <div id="history-list"></div>
        </aside>
        <div class="chat-panel">
            <div id="chat-box"></div>
            <div id="media-preview" class="media-preview" hidden></div>
            <form id="chat-form" class="ai-input">
                <input type="file" id="media-input" accept="*/*" multiple>
                <button class="upload-btn" id="upload-btn" type="button" title="Add image">📷</button>
                <input type="text" id="user-input" placeholder="Type your message here...">
                <button class="submit-btn" type="submit" title="Send">➤</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="ai.js"></script>
</body>
</html>
